image boot.vfat {
  vfat {
    files = {
      "zImage",
      "uEnv.txt",
      "am335x-antminer.dtb",
      "am335x-boneblack.dtb",
      "boot/am335x-boneblack.dtb"
    }
  }
  size = 64M
}
image sdcard.img {
  hdimage {}
  partition boot {
    partition-type = 0x0c
    bootable = "true"
    image = "boot.vfat"
    offset = 1M
  }
  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}
